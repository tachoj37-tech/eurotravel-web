<style>
  html,body{margin:0;padding:0;background:#000}
  .lienzo{position:relative;width:1080px;height:1350px;overflow:hidden;background:#1d1d1b;font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:#fff}
  .foto{position:absolute;inset:0;background:url("/img/hero2.jpg") center 62%/cover no-repeat}
  .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.18) 34%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 82%,rgba(0,0,0,.88) 100%)}

  .logo img{height:58px;display:block}
  .sello{position:absolute;top:56px;right:48px;background:#db0d0d;color:#fff;font-weight:800;font-stretch:75%;letter-spacing:.06em;text-transform:uppercase;font-size:24px;padding:14px 22px;border-radius:999px}
  .titulo{position:absolute;left:48px;right:48px;top:168px;font-weight:800;font-stretch:75%;font-size:112px;line-height:.94;letter-spacing:-.01em;text-transform:uppercase;text-shadow:0 4px 24px rgba(0,0,0,.45)}
  .titulo em{font-style:normal;color:#ff2b2b}
  .pie{position:absolute;left:48px;right:48px;bottom:56px}
  .baja{font-weight:500;font-size:34px;line-height:1.25;margin:0 0 26px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .baja b{font-weight:700}
  .boton{display:inline-flex;align-items:center;gap:16px;background:#25d366;color:#0b1a12;font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.04em;font-size:36px;padding:22px 36px;border-radius:999px}
  .boton svg{width:40px;height:40px}
</style></head><body>
