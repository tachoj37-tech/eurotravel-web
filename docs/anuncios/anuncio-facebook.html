<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Anuncio Facebook 1200x628</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,800;100,500;100,700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000}
  .lienzo{position:relative;width:1200px;height:628px;overflow:hidden;background:#db0d0d;font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:#fff;display:grid;grid-template-columns:440px 1fr}
  .panel{position:relative;padding:36px 40px;display:flex;flex-direction:column;justify-content:space-between}
  .logo{background:#fff;border-radius:14px;padding:12px 18px;align-self:flex-start}
  .logo img{height:46px;display:block}
  .titulo{font-weight:800;font-stretch:75%;font-size:76px;line-height:.94;letter-spacing:-.01em;text-transform:uppercase;margin:0}
  .baja{font-weight:500;font-size:22px;line-height:1.3;margin:18px 0 0;opacity:.95}
  .baja b{font-weight:700}
  .boton{display:inline-flex;align-items:center;gap:12px;background:#fff;color:#db0d0d;font-weight:800;font-stretch:75%;text-transform:uppercase;letter-spacing:.04em;font-size:24px;padding:16px 26px;border-radius:999px;align-self:flex-start}
  .boton svg{width:28px;height:28px}
  .foto{position:relative;background:url("/img/hero2.jpg") 62% 55%/cover no-repeat}
  .foto:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#db0d0d 0%,rgba(219,13,13,0) 14%)}
  .sello{position:absolute;right:28px;bottom:28px;background:rgba(29,29,27,.85);color:#fff;font-weight:800;font-stretch:75%;letter-spacing:.06em;text-transform:uppercase;font-size:17px;padding:10px 16px;border-radius:999px}
</style></head><body>
<div class="lienzo">
  <div class="panel">
    <div class="logo"><img src="/img/logo.png" alt="Eurotravel"></div>
    <div>
      <h1 class="titulo">Todos juntos,<br>sin manejar.</h1>

    </div>

  </div>

</div>
